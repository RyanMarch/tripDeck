<svg xmlns="http://www.w3.org/2000/svg" width="220" height="44" viewBox="0 0 220 44" fill="none">
  <defs>
    <filter id="btn-shadow" x="-10%" y="-10%" width="120%" height="135%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
    <linearGradient id="btn-sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="216" height="40" rx="8" fill="url(#btn-sky)" stroke="rgba(255, 255, 255, 0.25)"
    stroke-width="1" filter="url(#btn-shadow)" />
  <text x="110" y="26" fill="#ffffff"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Inter', sans-serif" font-size="14.5"
    font-weight="700" text-anchor="middle" letter-spacing="0.2">Try TripDeck →</text>
</svg>
